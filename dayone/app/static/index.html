<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DayOne - registry agent (prototype)</title>
<style>
  :root { --green:#075e54; --green2:#128c7e; --out:#d9fdd3; --in:#fff; --bg:#efe7dd; --ink:#111b21; --muted:#667781; --line:#d1d7db; --warn:#b3541e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:#d9dbd5; }
  .app { display:flex; height:100vh; max-width:1180px; margin:0 auto; background:#fff; box-shadow:0 1px 8px rgba(0,0,0,.2); }
  .chat { flex:1 1 auto; display:flex; flex-direction:column; min-width:0; position:relative; }
  header { background:var(--green); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; }
  .avatar { width:38px; height:38px; border-radius:50%; background:#dfe5e7; color:var(--green); display:grid; place-items:center; font-weight:700; flex:none; }
  header .name { font-weight:600; } header .sub { font-size:12px; opacity:.85; }
  .pill { font-size:12px; padding:4px 10px; border-radius:12px; background:rgba(255,255,255,.18); white-space:nowrap; }
  .pill.off { background:var(--warn); }
  .lang { display:flex; border:1px solid rgba(255,255,255,.5); border-radius:14px; overflow:hidden; margin-left:auto; flex:none; }
  .lang button { background:transparent; color:#fff; border:0; padding:4px 10px; font:inherit; font-size:12px; cursor:pointer; }
  .lang button.on { background:#fff; color:var(--green); font-weight:600; }
  #login .lang { margin-left:0; justify-self:end; border-color:var(--line); }
  #login .lang button { color:var(--muted); } #login .lang button.on { background:var(--green2); color:#fff; }
  #log { flex:1; overflow-y:auto; padding:14px 6%; background:var(--bg); }
  .chat.drop #log { outline:3px dashed var(--green2); outline-offset:-10px; }
  .msg { max-width:78%; margin:4px 0; padding:7px 10px 5px; border-radius:8px; box-shadow:0 1px .5px rgba(0,0,0,.13); white-space:pre-wrap; word-wrap:break-word; clear:both; }
  .bot { background:var(--in); float:left; border-top-left-radius:0; }
  .user { background:var(--out); float:right; border-top-right-radius:0; }
  .msg .t { font-size:11px; color:var(--muted); text-align:right; margin-top:2px; }
  .msg img { max-width:220px; max-height:260px; display:block; border-radius:6px; margin-bottom:4px; }
  .btns { clear:both; float:left; max-width:86%; display:flex; flex-wrap:wrap; gap:6px; margin:2px 0 8px; }
  .btns button { border:1px solid var(--line); background:#fff; color:#027eb5; border-radius:16px; padding:7px 13px; font:inherit; cursor:pointer; }
  .btns button:hover { background:#f0f8ff; }
  .btns.stale button { color:var(--muted); cursor:default; opacity:.55; }
  .composer { display:flex; gap:8px; padding:8px 10px; background:#f0f2f5; align-items:center; }
  .composer input[type=text] { flex:1; min-width:0; border:0; border-radius:20px; padding:10px 14px; font:inherit; outline:none; }
  .icon { width:42px; height:42px; border-radius:50%; border:0; background:var(--green2); color:#fff; font-size:18px; cursor:pointer; flex:none; }
  .icon.cam { background:#fff; color:var(--muted); border:1px solid var(--line); }
  aside { width:330px; flex:0 0 330px; border-left:1px solid var(--line); background:#fafafa; overflow-y:auto; padding:12px; font-size:13px; }
  aside h3 { margin:14px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  aside h3:first-child { margin-top:0; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; }
  .switch { position:relative; width:42px; height:24px; flex:none; } .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:#c9ced1; border-radius:24px; cursor:pointer; transition:.15s; }
  .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  input:checked + .slider { background:var(--green2); } input:checked + .slider:before { transform:translateX(18px); }
  .rec { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 8px; margin:5px 0; overflow-wrap:anywhere; }
  .badge { display:inline-block; font-size:11px; font-weight:600; padding:2px 7px; border-radius:10px; background:#e7eef1; }
  .badge.SYNCED { background:#d3f2dc; color:#0b6b2b; } .badge.REGISTERED,.badge.PATIENT_MATCHED,.badge.VALIDATED { background:#dff0ff; color:#0b4f8a; }
  .badge.PENDING_AI,.badge.CAPTURED { background:#fff1c9; color:#7a5a00; } .badge.NEEDS_REVIEW,.badge.AI_PROCESSED { background:#ffe3cf; color:#8a3d0b; }
  .badge.PROCESSING_FAILED,.badge.SYNC_FAILED,.badge.DUPLICATE_SUSPECTED,.badge.MANUAL_REVIEW_REQUIRED { background:#ffd9d9; color:#8f1d1d; }
  .ev { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:11px; color:#3b4a54; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note { color:var(--muted); font-size:12px; }
  /* status box: what the AI is doing right now, and why not when it is not */
  .status { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 10px; }
  .status.bad { border-color:#e3b08f; background:#fff6ef; }
  .status .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#2aa05b; margin-right:6px; }
  .status.bad .dot { background:var(--warn); }
  .status .detail { margin-top:4px; color:#6b3a16; font-size:12px; overflow-wrap:anywhere; }
  .linkbtn { border:1px solid var(--line); background:#fff; color:#027eb5; border-radius:14px; padding:4px 10px; font:inherit; font-size:12px; cursor:pointer; text-decoration:none; display:inline-block; margin-top:6px; }
  #login { position:fixed; inset:0; background:var(--green); display:grid; place-items:center; z-index:5; }
  /* minmax(0, 1fr): the column must not grow to the width of the longest account label */
  #login form { background:#fff; padding:26px; border-radius:12px; width:min(330px, calc(100vw - 32px)); display:grid; grid-template-columns:minmax(0, 1fr); gap:10px; }
  #login input, #login select, #login form > button { font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); width:100%; min-width:0; }
  #login form > button { background:var(--green2); color:#fff; border:0; cursor:pointer; }
  #err { color:#b00020; font-size:13px; min-height:1em; }
  @media (max-width:820px) { .app { flex-direction:column; height:auto; min-height:100vh; } aside { width:auto; flex:none; border-left:0; border-top:1px solid var(--line); } #log { min-height:60vh; padding:12px 16px; } }
</style>
</head>
<body>
<div id="login">
  <form onsubmit="return doLogin(event)">
    <div class="lang"><button type="button" data-lang="en" onclick="setLang('en')">EN</button><button type="button" data-lang="fr" onclick="setLang('fr')">FR</button></div>
    <strong style="font-size:18px" data-t="login_title"></strong>
    <span class="note" data-t="login_note"></span>
    <label class="note" for="username" data-t="login_roles"></label>
    <select id="username">
      <option value="midwife1" data-t="acc_midwife1"></option>
      <option value="midwife2" data-t="acc_midwife2"></option>
      <option value="supervisor1" data-t="acc_supervisor"></option>
      <option value="data1" data-t="acc_data"></option>
    </select>
    <input id="pin" type="password" data-tp="pin" autocomplete="off" required>
    <button data-t="unlock"></button>
    <div id="err"></div>
  </form>
</div>

<div class="app">
  <section class="chat" id="chat">
    <header>
      <div class="avatar">R</div>
      <div><div class="name">Registre maternel</div><div class="sub" id="who">agent</div></div>
      <div class="lang"><button data-lang="en" onclick="setLang('en')">EN</button><button data-lang="fr" onclick="setLang('fr')">FR</button></div>
      <div class="pill" id="net"></div>
    </header>
    <div id="log"></div>
    <div class="composer">
      <input type="file" id="file" accept="image/*" multiple hidden>
      <button class="icon cam" id="cam" data-tt="send_photo" onclick="document.getElementById('file').click()">📷</button>
      <input type="text" id="text" data-tp="type_message" autocomplete="off">
      <button class="icon" onclick="sendText()" data-tt="send">➤</button>
    </div>
  </section>
  <aside>
    <h3 data-t="h_status"></h3>
    <div class="status" id="status"><span class="note">…</span></div>
    <h3 data-t="h_demo"></h3>
    <div class="row"><span data-t="connectivity"></span><label class="switch"><input type="checkbox" id="online" checked onchange="setFlag('connectivity', this.checked)"><span class="slider"></span></label></div>
    <div class="row"><span data-t="ai_extraction"></span><label class="switch"><input type="checkbox" id="ai" checked onchange="setFlag('ai', this.checked)"><span class="slider"></span></label></div>
    <h3 data-t="h_queues"></h3>
    <div class="row"><span data-t="q_ai"></span><b id="q_ai">0</b></div>
    <div class="row"><span data-t="q_sync"></span><b id="q_sync">0</b></div>
    <div class="row"><span data-t="q_srv"></span><b id="q_srv">-</b></div>
    <a class="linkbtn" id="dash" target="_blank" rel="noopener" data-t="dashboard"></a>
    <h3 data-t="h_records"></h3>
    <div id="recs"></div>
    <h3 data-t="h_audit"></h3>
    <div id="events"></div>
  </aside>
</div>

<script>
// Every word of the page in both languages.  The chat messages themselves come translated from the server.
const TXT = {
  en: { login_title: 'Registry agent - prototype',
        login_note: 'Synthetic data only. The device PIN unlocks the encrypted storage; the first login on a new device sets it.',
        login_roles: 'Demo account. The role decides what the account may see: midwives capture and review, the supervisor may open images, the data manager may not.',
        acc_midwife1: 'midwife1 (midwife)', acc_midwife2: 'midwife2 (midwife)',
        acc_supervisor: 'supervisor1 (supervisor: may view images)', acc_data: 'data1 (data manager: no images)',
        pin: 'Device PIN', unlock: 'Unlock', login_failed: 'login failed', wrong_pin: 'wrong PIN', unknown_account: 'unknown account',
        role_midwife: 'midwife', role_supervisor: 'supervisor', role_data_manager: 'data manager',
        online: 'online', offline: '📴 offline', send_photo: 'Send a photo of a registry page (or drop image files on the chat)',
        send: 'Send', type_message: 'Type a message', read_only: 'Read-only role',
        restricted: '🔒 image access restricted for this role', page_alt: 'registry page',
        upload_failed: n => `${n} file(s) could not be sent. Check that they are images and try again.`,
        h_status: 'AI status', h_demo: 'Demo controls (simulated)', connectivity: 'Connectivity', ai_extraction: 'AI extraction',
        h_queues: 'Queues', q_ai: 'Pending AI processing', q_sync: 'Waiting to synchronise', q_srv: 'Records on the server',
        dashboard: '📊 Open the anonymised dashboard', h_records: 'Records on this device', h_audit: 'Audit trail (latest)',
        none_yet: 'none yet', pages: n => `${n} page(s)`, pages_read: (a, n) => `${a} of ${n} page(s) read`,
        ai_ok: 'The AI is available', ai_not: 'The AI is not doing the work', since: 'since',
        next_try: s => `Next automatic try in about ${s} s.`, retry_now: 'Try again now',
        model: 'Model', extractor_fake: 'simulated extractor (invented values, no real reading)',
        thr_ar: v => `On pages with Arabic entries: every number below ${v}.`,
        thr_ar_all: v => `On pages with Arabic entries: every value below ${v}.`,
        thr: v => `I ask whenever my confidence is below ${v}`, thr_cal: 'set by the evaluation', thr_prov: 'provisional, not calibrated',
        thr_mismatch: (a, b) => `⚠️ The threshold was calibrated with ${a}; the app is running ${b}. Rerun the evaluation.`,
        whatsapp_on: 'WhatsApp connector active' },
  fr: { login_title: 'Agent du registre - prototype',
        login_note: 'Données synthétiques uniquement. Le code PIN de l\'appareil déverrouille le stockage chiffré ; la première connexion sur un nouvel appareil le définit.',
        login_roles: 'Compte de démonstration. Le rôle détermine ce que le compte peut voir : les sages-femmes saisissent et vérifient, le superviseur peut ouvrir les images, le gestionnaire de données ne le peut pas.',
        acc_midwife1: 'midwife1 (sage-femme)', acc_midwife2: 'midwife2 (sage-femme)',
        acc_supervisor: 'supervisor1 (superviseur : peut voir les images)', acc_data: 'data1 (gestionnaire de données : pas d\'images)',
        pin: 'Code PIN de l\'appareil', unlock: 'Déverrouiller', login_failed: 'échec de la connexion', wrong_pin: 'code PIN incorrect', unknown_account: 'compte inconnu',
        role_midwife: 'sage-femme', role_supervisor: 'superviseur', role_data_manager: 'gestionnaire de données',
        online: 'en ligne', offline: '📴 hors ligne', send_photo: 'Envoyer une photo d\'une page du registre (ou déposer des images sur la conversation)',
        send: 'Envoyer', type_message: 'Écrire un message', read_only: 'Rôle en lecture seule',
        restricted: '🔒 accès aux images restreint pour ce rôle', page_alt: 'page du registre',
        upload_failed: n => `${n} fichier(s) n'ont pas pu être envoyés. Vérifiez que ce sont des images et réessayez.`,
        h_status: 'État de l\'IA', h_demo: 'Commandes de démonstration (simulées)', connectivity: 'Connectivité', ai_extraction: 'Extraction par l\'IA',
        h_queues: 'Files d\'attente', q_ai: 'En attente de traitement par l\'IA', q_sync: 'En attente de synchronisation', q_srv: 'Registres sur le serveur',
        dashboard: '📊 Ouvrir le tableau de bord anonymisé', h_records: 'Registres sur cet appareil', h_audit: 'Journal d\'audit (récent)',
        none_yet: 'aucun pour l\'instant', pages: n => `${n} page(s)`, pages_read: (a, n) => `${a} page(s) lue(s) sur ${n}`,
        ai_ok: 'L\'IA est disponible', ai_not: 'L\'IA ne fait pas le travail', since: 'depuis',
        next_try: s => `Prochain essai automatique dans environ ${s} s.`, retry_now: 'Réessayer maintenant',
        model: 'Modèle', extractor_fake: 'extracteur simulé (valeurs inventées, aucune lecture réelle)',
        thr_ar: v => `Pages avec des entrées en arabe : chaque nombre en dessous de ${v}.`,
        thr_ar_all: v => `Pages avec des entrées en arabe : chaque valeur en dessous de ${v}.`,
        thr: v => `Je demande dès que ma confiance est inférieure à ${v}`, thr_cal: 'fixé par l\'évaluation', thr_prov: 'provisoire, non calibré',
        thr_mismatch: (a, b) => `⚠️ Le seuil a été calibré avec ${a} ; l'application utilise ${b}. Relancez l'évaluation.`,
        whatsapp_on: 'Connecteur WhatsApp actif' },
};
let token = null, lastId = 0, me = null, blobs = {}, lastState = null;
let lang = 'en';
try { lang = localStorage.getItem('dayone_lang') || 'en'; } catch (e) {}
if (!TXT[lang]) lang = 'en';
const T = (key, ...a) => { const v = TXT[lang][key]; return typeof v === 'function' ? v(...a) : v; };
const $ = id => document.getElementById(id);
const api = (path, opt = {}) => fetch(path, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + token } });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = s => esc(s).replace(/\*([^*\n]+)\*/g, '<b>$1</b>');

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = T(e.dataset.t); });
  document.querySelectorAll('[data-tp]').forEach(e => { e.placeholder = T(e.dataset.tp); });
  document.querySelectorAll('[data-tt]').forEach(e => { e.title = T(e.dataset.tt); });
  document.querySelectorAll('[data-lang]').forEach(e => { e.className = e.dataset.lang === lang ? 'on' : ''; });
  if (me) {
    $('who').textContent = me.username + ' · ' + T('role_' + me.role);
    if (me.role !== 'midwife') $('text').placeholder = T('read_only');
  }
  if (lastState) paint(lastState);
}
async function setLang(l) {
  lang = l;
  try { localStorage.setItem('dayone_lang', l); } catch (e) {}
  applyLang();
  if (token) await api('/api/language', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lang: l }) });
}

async function doLogin(e) {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: $('username').value, pin: $('pin').value }) });
  if (!r.ok) {
    const detail = (await r.json()).detail;
    $('err').textContent = detail === 'wrong PIN' ? T('wrong_pin') : detail === 'unknown account' ? T('unknown_account') : T('login_failed');
    return false;
  }
  const d = await r.json(); token = d.token; me = d.user;
  $('login').style.display = 'none';
  if (me.role !== 'midwife') { $('text').disabled = true; $('cam').disabled = true; }
  let chosen = null;
  try { chosen = localStorage.getItem('dayone_lang'); } catch (e) {}
  if (chosen && chosen !== d.lang) await setLang(chosen);       // the choice made on the login screen wins
  else { lang = d.lang; applyLang(); }
  poll(); setInterval(poll, 1000);
  return false;
}

async function thumb(pageId, img) {
  if (!blobs[pageId]) {
    const r = await api('/api/pages/' + pageId + '/image');
    if (!r.ok) { img.replaceWith(document.createTextNode(T('restricted'))); return; }
    blobs[pageId] = URL.createObjectURL(await r.blob());
  }
  img.src = blobs[pageId];
}

function render(msgs) {
  const log = $('log');
  for (const m of msgs) {
    if (m.id <= lastId) continue;
    lastId = m.id;
    document.querySelectorAll('.btns').forEach(b => { if (m.sender === 'user') b.classList.add('stale'); });
    const d = document.createElement('div');
    d.className = 'msg ' + (m.sender === 'bot' ? 'bot' : 'user');
    if (m.page_id && m.sender === 'user') { const im = document.createElement('img'); im.alt = T('page_alt'); im.onload = () => { log.scrollTop = log.scrollHeight; }; d.appendChild(im); thumb(m.page_id, im); }
    const body = document.createElement('div'); body.innerHTML = fmt(m.text); d.appendChild(body);
    const t = document.createElement('div'); t.className = 't'; t.textContent = m.ts.slice(11, 16) + (m.sender === 'user' ? ' ✓✓' : ''); d.appendChild(t);
    log.appendChild(d);
    if (m.buttons && m.buttons.length) {
      document.querySelectorAll('.btns').forEach(b => b.classList.add('stale'));
      const bs = document.createElement('div'); bs.className = 'btns';
      for (const b of m.buttons) {
        const el = document.createElement('button'); el.textContent = b.label;
        el.onclick = () => { if (!bs.classList.contains('stale')) send(b.payload); };
        bs.appendChild(el);
      }
      log.appendChild(bs);
    }
    log.scrollTop = log.scrollHeight;
  }
}

async function send(text) {
  const r = await api('/api/message', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
  if (r.ok) render(await r.json());
}
function sendText() { const t = $('text').value.trim(); if (t) { $('text').value = ''; send(t); } }
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

// Photos: the camera button, or image files dropped on the chat (handy on a laptop).
async function upload(files) {
  let failed = 0;
  for (const f of files) {
    if (f.type && !f.type.startsWith('image/')) { failed++; continue; }
    const fd = new FormData(); fd.append('file', f);
    const r = await api('/api/image', { method: 'POST', body: fd });
    if (r.ok) render(await r.json()); else failed++;
  }
  if (failed) alert(T('upload_failed', failed));
}
$('file').addEventListener('change', async e => { await upload(e.target.files); e.target.value = ''; });
const chat = $('chat');
['dragenter', 'dragover'].forEach(ev => chat.addEventListener(ev, e => { e.preventDefault(); if (me && me.role === 'midwife') chat.classList.add('drop'); }));
['dragleave', 'drop'].forEach(ev => chat.addEventListener(ev, e => { e.preventDefault(); chat.classList.remove('drop'); }));
chat.addEventListener('drop', e => { if (me && me.role === 'midwife' && e.dataTransfer.files.length) upload(e.dataTransfer.files); });

async function setFlag(which, value) {
  await api('/api/' + which, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ value }) });
  poll();
}
async function retryAi() { await api('/api/ai/retry', { method: 'POST' }); poll(); }

function paint(st) {
  $('online').checked = st.online; $('ai').checked = st.ai_enabled;
  $('net').textContent = st.online ? T('online') : T('offline'); $('net').className = 'pill' + (st.online ? '' : ' off');
  // --- what the AI is doing, and why not when it is not ---
  const bad = !st.ai_available;
  let h = `<div><span class="dot"></span><b>${bad ? T('ai_not') : T('ai_ok')}</b></div>`;
  if (bad) {
    h += `<div class="detail">${esc(st.ai_why_text || '')}${st.ai_since ? ' (' + T('since') + ' ' + esc(st.ai_since) + ')' : ''}</div>`;
    if (st.ai_detail) h += `<div class="detail">${esc(st.ai_detail)}</div>`;
    if (st.ai_retry_in) h += `<div class="detail">${T('next_try', st.ai_retry_in)}</div><button class="linkbtn" onclick="retryAi()">${T('retry_now')}</button>`;
  }
  h += `<div class="note" style="margin-top:6px">${st.extractor === 'fake' ? T('extractor_fake') : T('model') + ': ' + esc(st.model || st.extractor)}</div>`;
  h += `<div class="note">${T('thr', Math.round(st.threshold.value * 100) + '%')} (${st.threshold.calibrated ? T('thr_cal') : T('thr_prov')}).</div>`;
  if (st.threshold.arabic) h += `<div class="note">${T(st.threshold.arabic_scope === 'all' ? 'thr_ar_all' : 'thr_ar', Math.round(st.threshold.arabic * 100) + '%')}</div>`;
  if (st.threshold_model_mismatch) h += `<div class="detail">${esc(T('thr_mismatch', st.threshold.model, st.model))}</div>`;
  if (st.whatsapp) h += `<div class="note">${T('whatsapp_on')}</div>`;
  $('status').className = 'status' + (bad ? ' bad' : ''); $('status').innerHTML = h;
  $('dash').href = st.dashboard_url + '?lang=' + lang;
  $('q_ai').textContent = st.records.filter(r => r.state === 'PENDING_AI').length;
  $('q_sync').textContent = st.outbox_pending;
  $('q_srv').textContent = st.server_records === null ? '-' : st.server_records;
  $('recs').innerHTML = st.records.filter(r => !r.superseded_by).slice(-10).reverse().map(r =>
    `<div class="rec"><b>${r.id.slice(0, 6)}</b> <span class="badge ${r.state}">${r.state}</span><br>` +
    `<span class="note">${r.state === 'PENDING_AI' ? T('pages_read', r.read, r.pages) : T('pages', r.pages)}` +
    `${r.linking_code ? ' · code ' + esc(r.linking_code) : ''}${r.patient_id ? ' · patient ' + r.patient_id.slice(0, 6) : ''}` +
    `${r.failure_reason ? '<br>' + esc(r.failure_reason) : ''}</span></div>`).join('') || `<span class="note">${T('none_yet')}</span>`;
  $('events').innerHTML = st.events.slice().reverse().map(e =>
    `<div class="ev">${e.ts} ${e.record} ${esc(e.kind)}${e.to ? ' ' + (e.from || '') + '→' + e.to : ''}</div>`).join('');
}

async function poll() {
  const [m, s] = await Promise.all([api('/api/messages?after=' + lastId), api('/api/state')]);
  if (m.ok) render(await m.json());
  if (!s.ok) return;
  lastState = await s.json();
  if (lastState.lang !== lang) { lang = lastState.lang; try { localStorage.setItem('dayone_lang', lang); } catch (e) {} applyLang(); }   // changed by typing "français" / "english"
  else paint(lastState);
}
applyLang();
</script>
</body>
</html>
